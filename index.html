<style>
:root{color-scheme:light;--bg:#F3F6FA;--paper:#fff;--ink:#0E2147;--ink2:#17306A;--mute:#5B6B82;--line:#DCE3EC;--mint:#4BE0B8;

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Manrope,"Segoe UI",system-ui,sans-serif}
a{color:var(--rev)}h1,h2,h3{letter-spacing:-.02em;line-height:1.15}h1{font-size:2.1rem;margin:.2em 0 .5em}h2{font-size:1.25rem;margin:1.8em 0 .6em}
header{position:sticky;top:0;z-index:5;display:flex;gap:1.1rem;align-items:center;flex-wrap:wrap;padding:.7rem 1.4rem;background:#fff;border-bottom:1px solid var(--line)}
header a{color:var(--ink);text-decoration:none;font-weight:600;font-size:.95rem}header a:hover{color:var(--rev)}
.logo{display:flex;align-items:center;gap:.5rem;font-weight:800;font-size:1.25rem;margin-right:auto}
.chip{background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:.15rem .7rem;font-size:.85rem;color:var(--mute)}
.wrap{max-width:940px;margin:0 auto;padding:2rem 1.2rem 4rem}.in{max-width:1040px;margin:0 auto;padding:0 1.4rem}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:1.1rem 1.25rem;margin:.8rem 0;box-shadow:0 1px 2px rgba(14,33,71,.04)}
label{display:block;font-weight:700;font-size:.92rem;margin:.9rem 0 .3rem}
input,select,textarea{width:100%;padding:.65rem .75rem;border:1px solid #BFCADA;border-radius:8px;background:#fff;color:var(--ink);font:inherit}
button,.btn{background:var(--ink);color:#fff;border:0;border-radius:8px;padding:.65rem 1.15rem;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block;margin:.9rem .4rem 0 0}
button:hover,.btn:hover{background:var(--ink2)}button.ghost,.ghost{background:#fff;color:var(--ink);border:1px solid #BFCADA}
button.ok{background:var(--ok)}button.warn{background:var(--bad)}
:is(a,button,input,select,textarea):focus-visible{outline:3px solid var(--rev);outline-offset:2px}
.mute{color:var(--mute)}.row{display:flex;justify-content:space-between;gap:1rem;align-items:center;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:.4rem;padding:.1rem .65rem;border-radius:99px;font-weight:700;font-size:.82rem}
.badge:before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.b-verified{color:var(--ok);background:var(--okbg)}.b-pending{color:var(--wait);background:var(--waitbg)}.b-in_review{color:var(--rev);background:var(--revbg)}.b-unverifiable{color:var(--bad);background:var(--badbg)}
.stamp{display:inline-block;color:var(--ok);background:var(--okbg);padding:.1rem .65rem;border-radius:6px;font-weight:800;font-size:.85rem}
.bar{height:8px;background:var(--line);border-radius:4px;margin:.6rem 0}.bar i{display:block;height:100%;background:var(--ok);border-radius:4px}
table{width:100%;border-collapse:collapse}th{font-size:.8rem;color:var(--mute);font-weight:700}td,th{text-align:left;padding:.65rem .5rem;border-bottom:1px solid var(--line)}
.stats{display:flex;gap:.8rem;flex-wrap:wrap}.stat{flex:1 1 130px;background:#fff;border:1px solid var(--line);border-top:4px solid var(--ink);border-radius:10px;padding:.7rem .9rem;color:var(--mute);font-weight:600;font-size:.9rem}.stat b{font-size:1.9rem;display:block;color:var(--ink);line-height:1.2}
.stat:nth-child(1){border-top-color:#E0A21B}.stat:nth-child(2){border-top-color:var(--rev)}.stat:nth-child(3){border-top-color:var(--ok)}.stat:nth-child(4){border-top-color:var(--bad)}
.tl{margin:.6rem 0 0;padding-left:1rem;border-left:3px solid var(--line);font-size:.9rem}.tl div{margin:.3rem 0}
.steps{display:flex;align-items:center;margin:.9rem 0 .3rem}.st{display:flex;align-items:center;gap:.45rem;font-size:.85rem;font-weight:700;color:var(--mute)}
.st i{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:.75rem;background:#fff}
.st.on{color:var(--ink)}.st.on i{background:var(--ink);border-color:var(--ink);color:#fff}
.st.on.good i{background:var(--ok);border-color:var(--ok)}.st.on.bad i{background:var(--bad);border-color:var(--bad)}
.ln{flex:1;height:2px;background:var(--line);margin:0 .6rem;min-width:16px}.ln.on{background:var(--ink)}
.flash{background:var(--okbg);border:1px solid #B5E3D2;color:var(--ok);font-weight:600;padding:.7rem 1rem;border-radius:8px;margin:0 0 1rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
/* landing */
.hero{background:radial-gradient(900px 400px at 85% 0,#24449A 0,transparent 70%),var(--ink);color:#fff;padding:4.5rem 0 5rem}
.hero .in{display:grid;grid-template-columns:1.1fr .9fr;gap:3rem;align-items:center}
.hero h1{font-size:3.1rem;font-weight:800;margin:0 0 .5em}.hero p{color:#C9D6EE;font-size:1.12rem;max-width:34rem}
.hero .btn{background:var(--mint);color:var(--ink);margin-top:1.2rem}.hero .btn.ghost{background:transparent;color:#fff;border:1px solid #6C84BA}
.proof{background:#fff;color:var(--ink);border-radius:16px;padding:1.3rem 1.4rem;box-shadow:0 24px 50px rgba(0,0,0,.35);transform:rotate(1.5deg)}
.proof small{color:var(--mute);font-weight:600}.proof h3{margin:.2rem 0 .1rem;font-size:1.25rem}
.sec{padding:4rem 0}.sec.alt{background:#fff;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.sec h2{font-size:1.8rem;margin:0 0 1.2rem}.how{display:grid;grid-template-columns:repeat(4,1fr);gap:1.4rem}
.how b.n{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--ink);color:#fff;margin-bottom:.6rem}
.how h3{margin:.1rem 0 .3rem;font-size:1.05rem}.how p{margin:0;color:var(--mute);font-size:.95rem}
.who3{display:grid;grid-template-columns:repeat(3,1fr)}.who3>div{padding:0 1.6rem;border-left:3px solid var(--line)}.who3>div:first-child{border-left-color:var(--mint)}
.who3 h3{margin:0 0 .3rem}.who3 p{margin:0;color:var(--mute)}
.meaning{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem}.meaning p{margin:.4rem 0 0;color:var(--mute);font-size:.92rem}
.demo{background:var(--ink);color:#fff;border-radius:16px;padding:1.8rem}.demo p{color:#C9D6EE}.demo button{background:#fff;color:var(--ink);margin:.3rem .4rem 0 0}
footer{padding:1.6rem 1.4rem;text-align:center;color:var(--mute);font-size:.88rem;border-top:1px solid var(--line)}
@media(max-width:820px){.hero .in,.how,.who3,.meaning,.grid2{grid-template-columns:1fr}.hero h1{font-size:2.3rem}.who3>div{padding:1rem 1rem;border-left-width:3px;margin-bottom:.5rem}.proof{transform:none}}
[dir=rtl] .tl{border-left:0;padding-left:0;border-right:3px solid var(--line);padding-right:1rem}
[dir=rtl] .who3>div{border-left:0;border-right:3px solid var(--line)}[dir=rtl] .who3>div:first-child{border-right-color:var(--mint)}
.lang{width:auto;padding:.35rem .5rem;font-size:.85rem}.code{font-family:ui-monospace,Consolas,monospace;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:.1rem .45rem}
.src{color:var(--mute);font-size:.85rem;margin-top:.8rem}.chk{display:flex;gap:.6rem;flex-wrap:wrap;align-items:flex-start}.chk input{flex:1 1 220px}
@media print{header,footer,button,.noprint{display:none}}

function applyLang(){STATUS={pending:t("s_pending"),in_review:t("s_in_review"),verified:t("s_verified"),unverifiable:t("s_unverifiable")};
 document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr"}
function setLang(v){lang=v;try{localStorage.setItem("sp_lang",v)}catch(e){}applyLang();render()}
async function sha(x){try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(x));return [...new Uint8Array(b)].map(n=>n.toString(16).padStart(2,"0")).join("")}catch(e){return hp(x)}}
function repCode(id){const fp=hp(JSON.stringify([S.creds.filter(c=>c.uid===id&&c.status==="verified").map(c=>c.id),S.skills.filter(k=>k.uid===id&&k.assessed).map(k=>[k.id,k.assessed])]));return `SP-${id}-${fp.slice(0,6).toUpperCase()}`}
function checkCode(e){e.preventDefault();const c=e.target.c.value.trim(),p=c.split("-"),u=p[0]==="SP"&&U(p[1]),el=document.getElementById("chk");
 el.innerHTML=u&&u.role==="candidate"&&u.shared&&repCode(u.id)===c?`<span class="badge b-verified">Valid: report for ${esc(u.name)} matches the current verified records</span>`:`<span class="badge b-unverifiable">Not valid, or the records have changed since this code was issued</span>`;return false}
function exportData(){const u=me(),d={profile:{...u,pw:undefined,salt:undefined},skills:S.skills.filter(k=>k.uid===u.id),credentials:S.creds.filter(c=>c.uid===u.id)};
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)],{type:"application/json"}));a.download="my-skillproof-data.json";a.click()}
function deleteMe(){if(!confirm("Delete your account, skills and credentials? This cannot be undone."))return;const id=S.me;
 S.users=S.users.filter(u=>u.id!==id);S.skills=S.skills.filter(k=>k.uid!==id);S.creds=S.creds.filter(c=>c.uid!==id);S.me=null;save();go("#/");msg("Your account and data were deleted.");render()}

 l+=`<select class="lang" aria-label="Language" onchange="setLang(this.value)">${Object.entries(LANGS).map(([k,v])=>`<option value="${k}" ${k===lang?"selected":""}>${v}</option>`).join("")}</select>`;
 l+=`<button class="ghost" style="margin:0;padding:.4rem .8rem;font-size:.85rem" onclick="resetDemo()">${t("reset")}</button>`;document.getElementById("hd").innerHTML=l}

function render(){header();const h=location.hash||"#/",u=me();let html;
 const f=flash?`<div class="flash" role="status">${esc(flash)}</div>`:"";flash="";
 if(h==="#/register")html=registerPage();else if(h==="#/login")html=loginPage();
 else if(h.startsWith("#/report/"))html=report(h.slice(9));
 else if(!u)html=home();
 else if(u.role==="candidate")html=h==="#/profile"?profilePage():h==="#/credentials"?credsPage():h==="#/skills"?skillsPage():statusPage();
 else if(u.role==="reviewer")html=h.startsWith("#/rc/")?reviewCred(h.slice(5)):h.startsWith("#/rs/")?reviewSkill(h.slice(5)):reviewer();
 else html=employer();
 const landing=!u&&h==="#/";
 document.getElementById("app").innerHTML=(landing?(f?`<div class="wrap" style="padding-bottom:0">${f}</div>`:""):`<div class="wrap">${f}`)+html+(landing?"":"</div>")+footer()}

async function doRegister(e){e.preventDefault();const f=e.target,em=f.email.value.trim().toLowerCase();
 if(S.users.some(u=>u.email===em)){msg("An account with that email already exists.");render();return false}
 if(f.role.value==="reviewer"&&f.code.value!==REVIEWER_CODE){msg("That reviewer code is not valid.");render();return false}
 const salt=uid(),u=P({id:uid(),role:f.role.value,name:f.name.value.trim(),email:em,salt,pw:await sha(salt+"|"+f.pw.value),consent:now()});S.users.push(u);S.me=u.id;save();
 msg("Account created. "+(u.role==="candidate"?"Start by completing your profile.":""));go(u.role==="candidate"?"#/profile":"#/");render();return false}
function loginPage(){return `<h1>Log in</h1><form class="card" onsubmit="return doLogin(event)"><label>Email</label><input name="email" type="email" required>
<label>Password</label><input name="pw" type="password" required><button>Log in</button></form>`}
async function doLogin(e){e.preventDefault();const f=e.target,u=S.users.find(x=>x.email===f.email.value.trim().toLowerCase());
 if(!u||u.pw!==await sha((u.salt||"")+"|"+f.pw.value)){msg("Email or password is wrong.");render();return false}S.me=u.id;save();go("#/");render();return false}

function stepper(c){const i={pending:0,in_review:1,verified:2,unverifiable:2}[c.status],end=c.status==="verified"?"good":c.status==="unverifiable"?"bad":"";
 const L=["Submitted","In review",c.status==="unverifiable"?"Unable to verify":"Verified"],M=["✓","✓",c.status==="unverifiable"?"!":"✓"];
 return `<div class="steps" aria-label="Progress: ${STATUS[c.status]}">`+L.map((t,k)=>`${k?`<span class="ln ${k<=i?"on":""}"></span>`:""}<span class="st ${k<=i?"on":""} ${k===2?end:""}"><i>${k<=i?M[k]:k+1}</i>${t}</span>`).join("")+`</div>`}
function timeline(c){return `<div class="tl">${c.history.map(h=>`<div>${badge(h.s)} <span class="mute">${esc(h.at)} by ${esc(h.by)}</span></div>`).join("")}</div>`}

 <label>Years of experience</label><input name="years" type="number" min="0" max="60" value="0"><label>What have you done with it?</label><textarea name="details" rows="3"></textarea><button>Add skill</button></form>`}
function addSkill(e){e.preventDefault();const f=e.target;S.skills.push({id:uid(),uid:S.me,name:f.name.value.trim(),claimed:+f.claimed.value,years:+f.years.value||0,details:f.details.value.trim(),ev:[],assessed:null,note:"",by:""});save();render();return false}
function addEv(e,id){e.preventDefault();const f=e.target;S.skills.find(s=>s.id===id).ev.push({t:f.t.value.trim(),l:f.l.value.trim()});save();render();return false}

/* ---------- reviewer ---------- */
let FILTER="all";
function setFilter(v){FILTER=v;render()}
function reviewer(){const cs=S.creds,n=s=>cs.filter(c=>c.status===s).length,list=cs.filter(c=>FILTER==="all"||c.status===FILTER);
 return `<h1>Reviewer dashboard</h1><div class="stats">${Object.keys(STATUS).map(s=>`<div class="stat"><b>${n(s)}</b>${STATUS[s]}</div>`).join("")}</div>
 <h2>Credential submissions</h2><label for="flt" class="mute" style="font-weight:400">Show</label><select id="flt" style="width:auto" onchange="setFilter(this.value)"><option value="all">All statuses</option>${Object.entries(STATUS).map(([k,v])=>`<option value="${k}" ${FILTER===k?"selected":""}>${v}</option>`).join("")}</select>
 <div class="card"><table><tr><th>Person</th><th>Credential</th><th>Status</th><th></th></tr>${list.map(c=>`<tr><td>${esc(U(c.uid)?.name)}</td><td>${esc(c.title)}</td><td>${badge(c.status)}</td><td><a href="#/rc/${c.id}">Review</a></td></tr>`).join("")||`<tr><td colspan="4" class="mute">Nothing here.</td></tr>`}</table></div>
 <h2>Skills to assess</h2><div class="card"><table><tr><th>Person</th><th>Skill</th><th>Claimed</th><th>Assessed</th><th></th></tr>${S.skills.map(s=>`<tr><td>${esc(U(s.uid)?.name)}</td><td>${esc(s.name)}</td><td>${LEVELS[s.claimed]}</td><td>${s.assessed?LEVELS[s.assessed]:"Pending"}</td><td><a href="#/rs/${s.id}">Assess</a></td></tr>`).join("")}</table></div>`}
function reviewCred(id){const c=S.creds.find(x=>x.id===id);if(!c)return reviewer();const p=U(c.uid);
 return `<h1>${esc(c.title)} ${badge(c.status)}</h1><div class="card"><b>${esc(p.name)}</b> <span class="mute">${esc(p.country)}</span><br>${esc(c.type)} from ${esc(c.issuer)}, ${esc(c.year)}<br>${c.file?`Document: ${esc(c.file)}`:"No document attached. Verify with the issuer or a second source."}</div>
 <h2>Background to check against</h2><div class="card">${p.education.map(r=>`<div>Education: ${esc(r.a)}, ${esc(r.b)}, ${esc(r.c)}</div>`).join("")}${p.work.map(r=>`<div>Work: ${esc(r.a)}, ${esc(r.b)}, ${esc(r.c)}</div>`).join("")||""}${!p.education.length&&!p.work.length?`<span class="mute">Profile is empty.</span>`:""}</div>
 <h2>History</h2>${timeline(c)}<form class="card" onsubmit="return false"><label>Note to the candidate (required if unable to verify)</label><textarea id="rn" rows="3">${esc(c.note)}</textarea>
 <button type="button" class="ghost" onclick="setStatus('${c.id}','in_review')">Mark in review</button><button type="button" class="ok" onclick="setStatus('${c.id}','verified')">Verify</button><button type="button" class="warn" onclick="setStatus('${c.id}','unverifiable')">Unable to verify</button></form>`}
function setStatus(id,s){const c=S.creds.find(x=>x.id===id),n=document.getElementById("rn").value.trim();
 if(s==="unverifiable"&&!n){alert("Add a note explaining why, so the candidate knows what to do next.");return}
 c.status=s;c.note=n;c.history.push({s,at:now(),by:me().name});save();msg("Status updated to: "+STATUS[s]);go("#/");render()}
function reviewSkill(id){const s=S.skills.find(x=>x.id===id);if(!s)return reviewer();
 return `<h1>${esc(s.name)} <span class="mute">by ${esc(U(s.uid)?.name)}</span></h1><div class="card">Claimed: ${LEVELS[s.claimed]}, ${s.years} yr.<p>${esc(s.details)}</p></div><h2>Evidence</h2>
 ${s.ev.map(e=>`<div class="card">${esc(e.t)} ${e.l?`<a href="${esc(e.l)}" target="_blank" rel="noopener">open link</a>`:""}</div>`).join("")||`<p class="mute">No evidence yet.</p>`}
 <form class="card" onsubmit="return assess(event,'${s.id}')"><label>Assessed level</label><select name="a">${Object.entries(LEVELS).map(([k,v])=>`<option value="${k}" ${s.assessed==k?"selected":""}>${v}</option>`).join("")}</select>
 <label>Notes</label><textarea name="n" rows="3">${esc(s.note)}</textarea><button>Save assessment</button></form>`}
function assess(e,id){e.preventDefault();const f=e.target,s=S.skills.find(x=>x.id===id);s.assessed=+f.a.value;s.note=f.n.value.trim();s.by=me().name;save();msg("Assessment saved.");go("#/");render();return false}

/* ---------- report + employer ---------- */
function report(id){const p=U(id);if(!p||p.role!=="candidate")return `<h1>Report not found</h1>`;
 const v=me(),ok=p.shared||(v&&(v.id===p.id||v.role==="reviewer"||v.role==="employer"&&p.shared));
 if(!ok)return `<h1>This report is private</h1><p class="mute">${esc(p.name)} has not turned on sharing.</p>`;
 const cs=S.creds.filter(c=>c.uid===id&&c.status==="verified"),ss=S.skills.filter(s=>s.uid===id&&s.assessed).sort((a,b)=>b.assessed-a.assessed);
 return `<h1>Competency report: ${esc(p.name)}</h1><p>${esc(p.headline)} <span class="mute">${esc(p.country)}</span></p><p>${esc(p.summary)}</p>
 <h2>Verified credentials</h2>${cs.map(c=>`<div class="card"><div class="row"><b>${esc(c.title)}</b><span class="stamp">Verified</span></div><div class="mute">${esc(c.type)}, ${esc(c.issuer)}, ${esc(c.year)}</div>${c.note?`<p>${esc(c.note)}</p>`:""}</div>`).join("")||`<p class="mute">None verified yet.</p>`}
 <h2>Assessed skills</h2>${ss.map(s=>`<div class="card"><div class="row"><b>${esc(s.name)}</b><span class="stamp">${LEVELS[s.assessed]}</span></div><div class="bar" aria-hidden="true"><i style="width:${s.assessed*20}%"></i></div><div class="mute">${s.years} yr experience. Assessed by ${esc(s.by)}.</div>${s.note?`<p>${esc(s.note)}</p>`:""}</div>`).join("")||`<p class="mute">None assessed yet.</p>`}
 <div class="card"><b>Report code</b> <span class="code">${repCode(p.id)}</span><p class="mute" style="margin:.4rem 0 0">Anyone can check this code on the home page. It stops matching if the verified records change.</p></div><p class="mute noprint">Demo: this report reads from this browser's storage. A live version would have a public link.</p><button class="noprint" onclick="window.print()">Print or save as PDF</button>`}
function matches(){const q=(window._q||"").toLowerCase();
 return S.users.filter(p=>p.role==="candidate"&&p.shared).flatMap(p=>[
  ...S.skills.filter(s=>s.uid===p.id&&s.assessed&&s.name.toLowerCase().includes(q)).map(s=>({p,k:s.name,t:"Skill: "+LEVELS[s.assessed]})),
  ...S.creds.filter(c=>c.uid===p.id&&c.status==="verified"&&(c.title+c.type).toLowerCase().includes(q)).map(c=>({p,k:c.title,t:"Verified credential"}))])}
function results(){return matches().map(m=>`<div class="card"><div class="row"><b>${esc(m.k)}</b><span class="stamp">${esc(m.t)}</span></div><div class="mute">${esc(m.p.name)}. ${esc(m.p.headline)}</div><a href="#/report/${m.p.id}">View full report</a></div>`).join("")||`<p class="mute">No shared, verified matches yet.</p>`}
function employer(){return `<h1>Find verified talent</h1><div class="card"><label for="q">Skill or qualification</label><input id="q" value="${esc(window._q||"")}" placeholder="e.g. Python, degree" oninput="window._q=this.value;document.getElementById('res').innerHTML=results()"></div><div id="res">${results()}</div>`}

addEventListener("hashchange",render);
(async()=>{if(S.users.some(u=>u.pw==="")){const h=await sha("demo|demo1234");S.users.forEach(u=>{if(u.pw===""){u.salt="demo";u.pw=h}});save()}applyLang();render()})();
</script></body></html>
